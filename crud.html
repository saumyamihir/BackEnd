<!DOCTYPE html>
<html>
<head>
    <title>Product Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            width: 380px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff7eb3, #ff758c);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #43cea2, #185a9d);
        }

        ul {
            margin-top: 15px;
            max-height: 180px;
            overflow-y: auto;
        }

        li {
            list-style: none;
            background: rgba(255,255,255,0.2);
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions button {
            width: auto;
            padding: 5px 8px;
            margin-left: 5px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

<h2>🛒 Product Manager</h2>

<form id="productForm">
    <input type="text" id="name" placeholder="Product Name" required>
    <input type="number" id="price" placeholder="Price" required>
    <button type="submit">➕ Add Product</button>
</form>

<button onclick="loadProducts()">📋 Refresh List</button>

<ul id="productList"></ul>

</div>

<script>
const form = document.getElementById("productForm");

// ADD
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    let name = document.getElementById("name").value;
    let price = document.getElementById("price").value;

    await fetch("http://localhost:5000/add-product", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, price })
    });

    alert("✅ Product Added");
    form.reset();
    loadProducts();
});

// LOAD
async function loadProducts() {
    let res = await fetch("http://localhost:5000/products");
    let data = await res.json();

    let list = document.getElementById("productList");
    list.innerHTML = "";

    data.forEach(p => {
        let li = document.createElement("li");

        li.innerHTML = `
            <span>${p.name} - ₹${p.price}</span>
            <div class="actions">
                <button onclick="editProduct('${p.name}', ${p.price})">✏</button>
                <button onclick="deleteProduct('${p.name}')">❌</button>
            </div>
        `;

        list.appendChild(li);
    });
}

// DELETE
async function deleteProduct(name) {
    await fetch(`http://localhost:5000/delete-product/${name}`, {
        method: "DELETE"
    });

    alert("❌ Deleted");
    loadProducts();
}

// UPDATE (fill form)
function editProduct(name, price) {
    document.getElementById("name").value = name;
    document.getElementById("price").value = price;
}

// UPDATE (submit)
form.addEventListener("submit", async (e) => {
    if (document.getElementById("name").dataset.editing) {
        e.preventDefault();

        let name = document.getElementById("name").value;
        let price = document.getElementById("price").value;

        await fetch(`http://localhost:5000/update-product/${name}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ price })
        });

        alert("✏ Updated");
        delete document.getElementById("name").dataset.editing;
        form.reset();
        loadProducts();
    }
});

// Load on start
loadProducts();
</script>

</body>
</html>
